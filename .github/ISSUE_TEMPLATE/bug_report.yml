name: Bug report
description: Something in UIGraph is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `uigraph ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UIGraph version
      description: Output of `uigraph --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version and browser, if relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove any secrets or private project details.
